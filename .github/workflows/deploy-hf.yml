name: Déploiement Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure le remote Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKET_GTFS_UNIVERSAL }}
        run: |
          git remote add hf "https://antoinechevre:${HF_TOKEN}@huggingface.co/spaces/antoinechevre/GTFS_analysis_universal"

      - name: Déploie sur le Space
        run: ./scripts/deploy_hf.sh
